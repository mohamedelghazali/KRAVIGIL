[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kravigil"
version = "0.1.0"
description = "Enterprise Offensive Security and Vulnerability Intelligence Platform"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.8,<1", "black>=24,<27", "mypy>=1.10,<2"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["backend*", "workers*", "engines*", "ai*", "agents*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
