apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: kravigil
type: Opaque
stringData:
  SECRET_KEY: "generate_a_random_64_char_string_here"
  DATABASE_URL: "postgresql://kravigil_admin:kravigil_secure_db_pass@postgres:5432/kravigil_db"
  REDIS_URL: "redis://redis:6379/0"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ACCESS_KEY: "kravigil_minio"
  MINIO_SECRET_KEY: "kravigil_minio_secure_pass"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kravigil
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/your-org/kravigil-backend:latest
        envFrom:
        - secretRef:
            name: backend-secret
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kravigil
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
