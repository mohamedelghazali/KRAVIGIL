services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kravigil_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kravigil_secure_db_pass}
      POSTGRES_DB: kravigil_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data_plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kravigil_admin -d kravigil_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://kravigil_admin:${DB_PASSWORD:-kravigil_secure_db_pass}@db:5432/kravigil_db?sslmode=disable"
    networks:
      - data_plane
      - monitoring_plane

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-kravigil_secure_redis_pass}
    volumes:
      - redisdata:/data
    networks:
      - data_plane
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kravigil_secure_redis_pass}
    networks:
      - data_plane
      - monitoring_plane

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-kravigil_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-kravigil_minio_secure_pass}
    volumes:
      - miniodata:/data
    networks:
      - data_plane
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  network_engine:
    build:
      context: ..
      dockerfile: engines/network_cpp/Dockerfile
    networks:
      - execution_plane
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/network_engine.json
    read_only: true
    tmpfs:
      - /tmp:size=512m
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://kravigil_admin:${DB_PASSWORD:-kravigil_secure_db_pass}@db:5432/kravigil_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kravigil_secure_redis_pass}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-kravigil_minio}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-kravigil_minio_secure_pass}
      - SECRET_KEY=${SECRET_KEY:-generate_a_random_64_char_string_here}
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - control_plane
      - data_plane
      - execution_plane
      - monitoring_plane
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      - DATABASE_URL=postgresql://kravigil_admin:${DB_PASSWORD:-kravigil_secure_db_pass}@db:5432/kravigil_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kravigil_secure_redis_pass}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-kravigil_minio}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-kravigil_minio_secure_pass}
      - SECRET_KEY=${SECRET_KEY:-generate_a_random_64_char_string_here}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      network_engine:
        condition: service_started
    networks:
      - control_plane
      - data_plane
      - execution_plane
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    networks:
      - control_plane
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - control_plane
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - monitoring_plane
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - prometheus
    networks:
      - monitoring_plane
    restart: unless-stopped

networks:
  control_plane:
    driver: bridge
  data_plane:
    driver: bridge
    internal: true
  execution_plane:
    driver: bridge
  monitoring_plane:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
