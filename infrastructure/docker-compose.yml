services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kravigil_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-kravigil_db}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data_plane]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kravigil_admin} -d ${POSTGRES_DB:-kravigil_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes: [redisdata:/data]
    networks: [data_plane]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes: [miniodata:/data]
    networks: [data_plane]
    restart: unless-stopped
  network_engine:
    build:
      context: ..
      dockerfile: engines/network_cpp/Dockerfile
    networks: [execution_plane]
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:size=512m]
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    networks: [control_plane, data_plane, execution_plane]
    ports: ["8000:8000"]
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: workers/Dockerfile
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      network_engine: {condition: service_started}
      minio: {condition: service_started}
    networks: [control_plane, data_plane, execution_plane]
    restart: unless-stopped
networks:
  control_plane:
    driver: bridge
  data_plane:
    driver: bridge
    internal: true
  execution_plane:
    driver: bridge
volumes:
  pgdata:
  redisdata:
  miniodata:
