services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kravigil_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: kravigil_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data_plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kravigil_admin -d kravigil_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://kravigil_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@db:5432/kravigil_db?sslmode=disable"
    networks:
      - data_plane
      - monitoring_plane

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    networks:
      - data_plane
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    networks:
      - data_plane
      - monitoring_plane

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD must be set}
    volumes:
      - miniodata:/data
    networks:
      - data_plane
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  network_engine:
    environment:
      KRAVIGIL_ENGINE_AUTH_TOKEN: ${KRAVIGIL_ENGINE_AUTH_TOKEN:?KRAVIGIL_ENGINE_AUTH_TOKEN must be set}
      KRAVIGIL_TLS_CERT: /run/secrets/network-engine.crt
      KRAVIGIL_TLS_KEY: /run/secrets/network-engine.key
      KRAVIGIL_TLS_CA: /run/secrets/network-engine-ca.crt
    volumes:
      - ./certs/network-engine/server.crt:/run/secrets/network-engine.crt:ro
      - ./certs/network-engine/server.key:/run/secrets/network-engine.key:ro
      - ./certs/network-engine/ca.crt:/run/secrets/network-engine-ca.crt:ro
    build:
      context: ..
      dockerfile: engines/network_cpp/Dockerfile
    networks:
      - execution_plane
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/network_engine.json
    read_only: true
    tmpfs:
      - /tmp:size=512m
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/50051'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://kravigil_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@db:5432/kravigil_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:?MINIO_USER must be set}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:?MINIO_PASSWORD must be set}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DEBUG=false
      - MINIO_BUCKET=${MINIO_BUCKET:-kravigil-evidence}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MINIO_SECURE=false
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-[\"http://localhost\"]}
      - ALLOWED_SCAN_CIDRS=${ALLOWED_SCAN_CIDRS:-[]}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - KRAVIGIL_ENGINE_HOST=network_engine
      - KRAVIGIL_ENGINE_AUTH_TOKEN=${KRAVIGIL_ENGINE_AUTH_TOKEN:?KRAVIGIL_ENGINE_AUTH_TOKEN must be set}
      - KRAVIGIL_TLS_CA=/run/secrets/network-engine-ca.crt
      - KRAVIGIL_TLS_CLIENT_CERT=/run/secrets/backend-client.crt
      - KRAVIGIL_TLS_CLIENT_KEY=/run/secrets/backend-client.key
    volumes:
      - ./certs/network-engine/ca.crt:/run/secrets/network-engine-ca.crt:ro
      - ./certs/network-engine/backend-client.crt:/run/secrets/backend-client.crt:ro
      - ./certs/network-engine/backend-client.key:/run/secrets/backend-client.key:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      network_engine:
        condition: service_healthy
    networks:
      - control_plane
      - data_plane
      - execution_plane
      - monitoring_plane
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      - DATABASE_URL=postgresql://kravigil_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@db:5432/kravigil_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:?MINIO_USER must be set}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:?MINIO_PASSWORD must be set}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - MINIO_BUCKET=${MINIO_BUCKET:-kravigil-evidence}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - ALLOWED_SCAN_CIDRS=${ALLOWED_SCAN_CIDRS:-[]}
      - SAST_WORKSPACE_ROOT=/workspace
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp-credentials.json
      - MINIO_SECURE=false
      - KRAVIGIL_ENGINE_HOST=network_engine
      - KRAVIGIL_ENGINE_AUTH_TOKEN=${KRAVIGIL_ENGINE_AUTH_TOKEN:?KRAVIGIL_ENGINE_AUTH_TOKEN must be set}
      - KRAVIGIL_TLS_CA=/run/secrets/network-engine-ca.crt
      - KRAVIGIL_TLS_CLIENT_CERT=/run/secrets/worker-client.crt
      - KRAVIGIL_TLS_CLIENT_KEY=/run/secrets/worker-client.key
    volumes:
      - ./certs/network-engine/ca.crt:/run/secrets/network-engine-ca.crt:ro
      - ./certs/network-engine/worker-client.crt:/run/secrets/worker-client.crt:ro
      - ./certs/network-engine/worker-client.key:/run/secrets/worker-client.key:ro
      - ../workspace:/workspace:ro
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-/dev/null}:/run/secrets/gcp-credentials.json:ro
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      network_engine:
        condition: service_healthy
    networks:
      - control_plane
      - data_plane
      - execution_plane
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    networks:
      - control_plane
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - control_plane
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - monitoring_plane
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - prometheus
    networks:
      - monitoring_plane
    restart: unless-stopped

networks:
  control_plane:
    driver: bridge
  data_plane:
    driver: bridge
    internal: true
  execution_plane:
    driver: bridge
  monitoring_plane:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
