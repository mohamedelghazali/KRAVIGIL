version: '3.8'

services:
  backup:
    image: docker:24
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backup_data:/backups/kravigil
    environment:
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=${MINIO_BUCKET:-kravigil-evidence}
    networks:
      - data_plane
    entrypoint: ["sh", "-c", "echo '0 2 * * * /scripts/backup.sh' | crontab - && crond -f"]

volumes:
  backup_data:

networks:
  data_plane:
    external: true
    name: infrastructure_data_plane
