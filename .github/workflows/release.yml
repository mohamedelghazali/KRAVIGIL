name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: |
          ghcr.io/${{ github.repository }}/kravigil-backend
          ghcr.io/${{ github.repository }}/kravigil-worker
          ghcr.io/${{ github.repository }}/kravigil-network-engine
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest

    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./backend/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/kravigil-backend:${{ github.ref_name }}

    - name: Build and push Worker
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./infrastructure/docker/worker.Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/kravigil-worker:${{ github.ref_name }}

    - name: Build and push Network Engine
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./engines/network_cpp/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/kravigil-network-engine:${{ github.ref_name }}
