name: Release Pipeline

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kravigil_admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: kravigil_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov bandit pip-audit
      - name: Compile Python
        run: python -m compileall -q backend workers ai shared scripts database
      - name: Apply Alembic migrations
        env:
          DATABASE_URL: postgresql://kravigil_admin:test_password@localhost:5432/kravigil_test
        run: alembic upgrade head
      - name: Create restricted RLS test role
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U kravigil_admin -d kravigil_test -c "CREATE ROLE kravigil_app LOGIN PASSWORD 'test_app_password' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U kravigil_admin -d kravigil_test -c "GRANT CONNECT ON DATABASE kravigil_test TO kravigil_app"
          psql -h localhost -U kravigil_admin -d kravigil_test -c "GRANT USAGE ON SCHEMA public TO kravigil_app"
          psql -h localhost -U kravigil_admin -d kravigil_test -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO kravigil_app"
          psql -h localhost -U kravigil_admin -d kravigil_test -c "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO kravigil_app"
      - name: Run backend and security tests
        env:
          DATABASE_URL: postgresql://kravigil_admin:test_password@localhost:5432/kravigil_test
          RLS_DATABASE_URL: postgresql://kravigil_app:test_app_password@localhost:5432/kravigil_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_for_ci
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: test_minio_user
          MINIO_SECRET_KEY: test_minio_password
          MINIO_BUCKET: kravigil-test
          MINIO_SECURE: "false"
          DEBUG: "True"
        run: pytest tests/unit tests/security -v
      - name: Run Bandit
        run: bandit -r backend workers engines ai agents shared -ll
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Build and test C++ network engine
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libprotobuf-dev protobuf-compiler libgrpc++-dev protobuf-compiler-grpc libgtest-dev libgmock-dev
          cmake -S engines/network_cpp -B engines/network_cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engines/network_cpp/build --parallel
          ctest --test-dir engines/network_cpp/build --output-on-failure
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: |
          ghcr.io/${{ github.repository }}/kravigil-backend
          ghcr.io/${{ github.repository }}/kravigil-worker
          ghcr.io/${{ github.repository }}/kravigil-network-engine
          ghcr.io/${{ github.repository }}/kravigil-frontend
          ghcr.io/${{ github.repository }}/kravigil-backup
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest

    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./backend/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/kravigil-backend:${{ github.ref_name }}

    - name: Build and push Worker
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./infrastructure/docker/worker.Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/kravigil-worker:${{ github.ref_name }}

    - name: Build and push Network Engine
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./engines/network_cpp/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/kravigil-network-engine:${{ github.ref_name }}

    - name: Build and push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/kravigil-frontend:${{ github.ref_name }}

    - name: Build and push Backup
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./infrastructure/backup/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/kravigil-backup:${{ github.ref_name }}
