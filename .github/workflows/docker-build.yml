name: Docker Image Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: kravigil-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./backend/Dockerfile
        push: false
        tags: kravigil-backend:ci
        
    - name: Build and push Worker
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./infrastructure/docker/worker.Dockerfile
        push: true
        tags: kravigil-worker:ci
        
    - name: Build and push Network Engine
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./engines/network_cpp/Dockerfile
        push: true
        tags: kravigil-network-engine:ci
