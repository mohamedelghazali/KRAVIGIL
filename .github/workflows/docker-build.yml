name: Docker Image Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: kravigil-docker-${{ github.ref }}
  # Never cancel an in-flight image verification; every image must finish building.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build backend image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./backend/Dockerfile
        push: false
        tags: kravigil-backend:ci
        
    - name: Build worker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./infrastructure/docker/worker.Dockerfile
        push: false
        tags: kravigil-worker:ci
        
    - name: Build network engine image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./engines/network_cpp/Dockerfile
        push: false
        tags: kravigil-network-engine:ci
