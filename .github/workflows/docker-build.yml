name: Docker Build & Push

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./backend/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/kravigil-backend:latest
        
    - name: Build and push Worker
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./infrastructure/docker/worker.Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/kravigil-worker:latest
        
    - name: Build and push Network Engine
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./engines/network_cpp/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/kravigil-network-engine:latest
