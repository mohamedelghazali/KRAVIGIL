name: Docker Image Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Keep each verification run alive until all images have been checked.
concurrency:
  group: kravigil-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-image:
    name: Build ${{ matrix.image.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            file: ./backend/Dockerfile
            context: .
            tag: kravigil-backend:ci
          - name: worker
            file: ./infrastructure/docker/worker.Dockerfile
            context: .
            tag: kravigil-worker:ci
          - name: network-engine
            file: ./engines/network_cpp/Dockerfile
            context: .
            tag: kravigil-network-engine:ci
          - name: frontend
            file: ./frontend/Dockerfile
            context: ./frontend
            tag: kravigil-frontend:ci
          - name: backup
            file: ./infrastructure/backup/Dockerfile
            context: .
            tag: kravigil-backup:ci
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: false
          tags: ${{ matrix.image.tag }}
