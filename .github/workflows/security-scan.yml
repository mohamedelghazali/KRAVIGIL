name: Security Scans
concurrency:
  group: kravigil-security-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install bandit pip-audit
      - run: bandit -r backend workers engines ai agents shared -ll
      - run: pip-audit -r requirements.txt
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Gitleaks scans the PR commit range and needs the parent commit locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
