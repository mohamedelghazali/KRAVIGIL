name: KRAVIGIL CI

concurrency:
  group: kravigil-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install Linters
      run: pip install ruff black mypy grpcio-tools
    - name: Generate gRPC Python bindings for type checks
      run: python -m grpc_tools.protoc -I shared/protocols --python_out=shared/protocols --grpc_python_out=shared/protocols shared/protocols/network_engine.proto
    - name: Run Ruff
      run: ruff check --select E9,F63,F7,F82 backend/ ai/ workers/ engines/
    - name: Run Black (existing formatting debt is non-blocking)
      continue-on-error: true
      run: black --check backend/ ai/ workers/ engines/
    - name: Run MyPy
      run: mypy --explicit-package-bases backend/ ai/ --ignore-missing-imports

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kravigil_admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: kravigil_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      s3mock:
        image: adobe/s3mock:5.2.3
        ports:
          - 9090:9090

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-mock
    - name: Compile Python source
      run: python -m compileall -q backend workers ai shared scripts database
    - name: Generate gRPC Python bindings
      run: python -m grpc_tools.protoc -I shared/protocols --python_out=shared/protocols --grpc_python_out=shared/protocols shared/protocols/network_engine.proto
    - name: Apply production migrations to PostgreSQL test service
      env:
        DATABASE_URL: postgresql://kravigil_admin:test_password@localhost:5432/kravigil_test
      run: alembic upgrade head
    - name: Provision a non-superuser RLS test role
      env:
        PGPASSWORD: test_password
      run: |
        psql -h localhost -U kravigil_admin -d kravigil_test -v ON_ERROR_STOP=1 <<'SQL'
        CREATE ROLE kravigil_app LOGIN PASSWORD 'test_app_password' NOSUPERUSER NOBYPASSRLS;
        GRANT CONNECT ON DATABASE kravigil_test TO kravigil_app;
        GRANT USAGE ON SCHEMA public TO kravigil_app;
        GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO kravigil_app;
        GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO kravigil_app;
        SQL
    - name: Wait for S3-compatible test endpoint
      run: |
        for attempt in {1..30}; do
          if curl --fail --silent http://localhost:9090/favicon.ico >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        exit 1
    - name: Run Unit, Integration, Regression & Security Tests
      env:
        DATABASE_URL: postgresql://kravigil_admin:test_password@localhost:5432/kravigil_test
        RLS_DATABASE_URL: postgresql://kravigil_app:test_app_password@localhost:5432/kravigil_test
        REDIS_URL: redis://localhost:6379/0
        PYTHONPATH: .:shared/protocols
        MINIO_ENDPOINT: localhost:9090
        MINIO_ACCESS_KEY: foo
        MINIO_SECRET_KEY: bar
        MINIO_BUCKET: kravigil-test
        MINIO_SECURE: "false"
        DEBUG: "True"
      run: |
        SECRET_KEY="$(openssl rand -hex 32)" pytest tests/unit tests/integration tests/regression tests/security -v --cov=backend --cov=ai

  cpp-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install C++ Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libboost-all-dev libprotobuf-dev protobuf-compiler libgrpc++-dev protobuf-compiler-grpc libgtest-dev libgmock-dev
    - name: Build Network Engine
      run: |
        cd engines/network_cpp
        mkdir build && cd build
        cmake ..
        make -j$(nproc)
    - name: Run C++ Tests
      run: |
        cd engines/network_cpp/build
        ./scanner_test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install dependencies
      run: npm install --no-audit --no-fund
    - name: Build frontend
      run: npm run build

  container-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate production Compose and deployment script
      run: |
        cp .env.example .env
        trap 'rm -f .env' EXIT
        bash -n scripts/deploy_prod.sh
        docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.prod.yml -f infrastructure/docker-compose.backup.yml config --quiet
    - name: Build backend image
      run: docker build -f backend/Dockerfile -t kravigil-backend:ci .
    - name: Build network engine image
      run: docker build -f engines/network_cpp/Dockerfile -t kravigil-network-engine:ci .
