name: KRAVIGIL CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kravigil_admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: kravigil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
        
    - name: Run Unit Tests
      env:
        DATABASE_URL: postgresql://kravigil_admin:test_password@localhost:5432/kravigil_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test_secret_key_for_ci
        DEBUG: "True"
      run: |
        pytest tests/unit -v --cov=backend --cov=ai

    - name: Run Security Tests
      env:
        DATABASE_URL: postgresql://kravigil_admin:test_password@localhost:5432/kravigil_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test_secret_key_for_ci
        DEBUG: "True"
      run: |
        pytest tests/security -v

  cpp-engine-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install C++ Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libboost-all-dev libprotobuf-dev protobuf-compiler libgrpc++-dev protobuf-compiler-grpc pkg-config
        
    - name: Build Network Engine
      run: |
        cd engines/network_cpp
        mkdir build && cd build
        cmake ..
        make -j$(nproc)
