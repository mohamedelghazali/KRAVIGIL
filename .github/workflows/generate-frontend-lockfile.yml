name: Generate frontend npm lockfile

on:
  push:
    branches:
      - fix/frontend-reproducible-install-2026-11-05

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Generate lockfile with npm
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            echo "Lockfile already exists; nothing to generate."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if [ ! -f frontend/package-lock.json ]; then
            echo "npm did not generate frontend/package-lock.json" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "build(frontend): generate npm lockfile"
          git push
